<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visit History - ClinicFlow</title>
  <link rel="stylesheet" href="/patient/history.css">
  <!-- Loaded in the head so the saved light/dark theme is applied before the page is drawn (no flash). -->
  <script src="/patient/history.js"></script>
</head>
<body>

  <header class="site-header">
    <a class="brand" href="/patient/home.html"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span id="clinicName">ClinicFlow</span></a>

    <nav class="top-nav" aria-label="Patient pages">
      <a href="/patient/home.html">Home</a>
      <a href="/patient/take-number.html">Take a Number</a>
      <a href="/patient/ticket.html">My Ticket</a>
      <a href="/patient/history.html" aria-current="page">History</a>
    </nav>

    <div class="header-tools">
      <a href="/patient/notifications.html" class="bell" id="bell" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M12 3a6 6 0 0 0-6 6v3.6L4.3 15.3A1 1 0 0 0 5.2 17h13.6a1 1 0 0 0 .9-1.7L18 12.6V9a6 6 0 0 0-6-6zm0 18a2.5 2.5 0 0 0 2.4-1.8H9.6A2.5 2.5 0 0 0 12 21z" fill="currentColor"/>
        </svg>
        <span class="bell-count" id="bellCount" hidden></span>
      </a>

      <div class="theme-switch" role="group" aria-label="Color theme">
        <button type="button" data-theme-set="light" aria-label="Light mode" title="Light mode">&#9728;</button>
        <button type="button" data-theme-set="dark" aria-label="Dark mode" title="Dark mode">&#9790;</button>
      </div>

      <div class="user-menu">
        <button type="button" class="user-button" id="userButton" aria-expanded="false" aria-controls="userMenu" aria-haspopup="true">
          <span class="avatar" id="headerInitials" aria-hidden="true"></span>
          <span class="user-name" id="headerName"></span>
        </button>
        <div class="user-dropdown" id="userMenu" hidden>
          <a href="/profile/profile.html">Edit Profile</a>
          <a href="/change-password/change-password.html">Change Password</a>
          <button type="button" id="logoutButton">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="page-title">
      <h1>Visit History</h1>
      <p class="now" id="now"></p>
    </div>

    <div class="alert alert-error" id="pageAlert" role="alert" hidden></div>

    <!-- Filters: changing one reloads the list -->
    <form class="filters" id="filters" aria-label="Filter visits">
      <div class="filter">
        <label class="cf-label" for="range">Date range</label>
        <select class="cf-input" id="range">
          <option value="">All dates</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
      </div>
      <div class="filter">
        <label class="cf-label" for="status">Status</label>
        <select class="cf-input" id="status">
          <option value="">All statuses</option>
          <option value="completed">Completed</option>
          <option value="skipped">Skipped</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <!-- Only shown when the clinic has more than one service -->
      <div class="filter" id="serviceFilter" hidden>
        <label class="cf-label" for="service">Service</label>
        <select class="cf-input" id="service">
          <option value="">All services</option>
        </select>
      </div>
    </form>

    <section class="results" aria-label="Visits" aria-live="polite">
      <p class="muted" id="loading">Loading your visits...</p>

      <!-- Phones: one small card per visit. Desktop: a real table. -->
      <table class="visits" id="visitsTable" hidden>
        <thead>
          <tr><th scope="col">Date</th><th scope="col">Ticket number</th><th scope="col">Service</th><th scope="col">Status</th><th scope="col">Wait time</th></tr>
        </thead>
        <tbody id="visitRows"></tbody>
      </table>

      <!-- Phones: add the next page under the list -->
      <button type="button" class="cf-btn cf-btn-secondary cf-btn-block load-more" id="loadMore" hidden>Load more</button>

      <!-- Desktop: previous / next page -->
      <div class="pager" id="pager" hidden>
        <button type="button" class="cf-btn cf-btn-secondary" id="prevButton">Previous</button>
        <span class="muted" id="pageInfo"></span>
        <button type="button" class="cf-btn cf-btn-secondary" id="nextButton">Next</button>
      </div>

      <div class="cf-card empty" id="empty" hidden>
        <h2 id="emptyTitle">No visits yet</h2>
        <p class="muted" id="emptyText">When you take a queue number, your visits will show up here.</p>
        <a href="/patient/take-number.html" class="cf-btn cf-btn-primary" id="emptyAction">Take a Number</a>
      </div>
    </section>
  </main>

  <!-- Visit detail: a bottom sheet on phones, a centered box on desktop -->
  <dialog id="detailDialog" aria-labelledby="detailTitle">
    <form method="dialog" class="dialog-body">
      <div class="dialog-head">
        <h2 id="detailTitle">Visit detail</h2>
        <button type="submit" class="dialog-x" aria-label="Close">&times;</button>
      </div>
      <p class="detail-ticket" id="detailTicket"></p>
      <dl class="detail-rows" id="detailRows"></dl>
      <button type="submit" class="cf-btn cf-btn-secondary cf-btn-block">Close</button>
    </form>
  </dialog>

  <nav class="tab-bar" aria-label="Patient pages">
    <a href="/patient/home.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="/patient/take-number.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Take a Number</a>
    <a href="/patient/ticket.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a2 2 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a2 2 0 0 1 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/><path d="M9 9h6M9 13h4"/></svg>My Ticket</a>
    <a href="/patient/history.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</a>
  </nav>

</body>
</html>
