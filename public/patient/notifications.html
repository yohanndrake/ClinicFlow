<!--patient/notifications.html - patient notifications page (feature 5)-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications - ClinicFlow</title>

  <script src="/patient/patient.js"></script>
  <link rel="stylesheet" href="/patient/notifications.css">
  <script src="/patient/notifications.js"></script>
</head>
<body>
  <header class="site-header cf-panel cf-topbar">
    <a class="back-button" href="/patient/home.html" aria-label="Back to home">&larr;</a>
    <a class="brand" href="/patient/home.html"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span><span id="clinicName">ClinicFlow</span></a>

    <div class="header-tools">
      <div class="theme-switch" role="group" aria-label="Color theme">
        <button type="button" data-theme-set="light" aria-label="Light mode" title="Light mode">&#9728;</button>
        <button type="button" data-theme-set="dark" aria-label="Dark mode" title="Dark mode">&#9790;</button>
      </div>

      <div class="user-menu">
        <button type="button" class="user-button" id="userButton" aria-expanded="false" aria-controls="userMenu" aria-haspopup="true">
          <span class="avatar" id="headerInitials" aria-hidden="true"></span>
          <span class="user-name" id="headerName"></span>
        </button>
        <div class="user-dropdown" id="userMenu" hidden>
          <a href="/profile/profile.html">Edit Profile</a>
          <a href="/change-password/change-password.html">Change Password</a>
          <button type="button" id="logoutButton">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main class="page">

    <section class="cf-card cf-card-raised panel">
      <div class="panel-head">
        <h1>Notifications</h1>
        <button type="button" class="cf-btn cf-btn-outline" id="markAll" disabled>Mark all as read</button>
      </div>

      <div class="alert alert-error" id="pageAlert" role="alert" hidden></div>

      <div class="tabs-row">
        <div class="tabs" role="group" aria-label="Show">
          <button type="button" class="cf-pill" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="cf-pill" data-filter="unread" aria-pressed="false">Unread</button>
        </div>
        <p class="muted" id="summary" aria-live="polite"></p>
      </div>

      <p class="muted" id="loading">Loading notifications...</p>
      <ul class="list" id="list"></ul>

      <div class="empty" id="empty" hidden>
        <h2 id="emptyTitle">No notifications</h2>
        <p class="muted" id="emptyText">We'll let you know here when your turn is near or called.</p>
      </div>
    </section>
  </main>

  <nav class="tab-bar cf-tabs" aria-label="Patient pages">
    <a href="/patient/home.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="/patient/take-number.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Take a Number</a>
    <a href="/patient/ticket.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a2 2 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a2 2 0 0 1 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/><path d="M9 9h6M9 13h4"/></svg>My Ticket</a>
    <a href="/patient/history.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</a>
  </nav>

</body>
</html>
