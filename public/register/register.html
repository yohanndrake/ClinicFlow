<!--register/register.html - patient sign up page-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - ClinicFlow</title>

  <link rel="stylesheet" href="/register/register.css">
  <script src="/register/register.js"></script>
</head>
<body>
  <header class="site-header cf-panel cf-topbar">
    <a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span><span>ClinicFlow</span></a>

    <div class="header-tools">
      <div class="theme-switch" role="group" aria-label="Color theme">
        <button type="button" data-theme-set="light" aria-label="Light mode" title="Light mode">&#9728;</button>
        <button type="button" data-theme-set="dark" aria-label="Dark mode" title="Dark mode">&#9790;</button>
      </div>

      <button type="button" class="menu-button" id="menuButton" aria-label="Menu" aria-expanded="false" aria-controls="siteMenu">&#9776;</button>
    </div>

    <nav class="site-menu" id="siteMenu" aria-label="Main menu">
      <a href="/board/board.html">Now Serving</a>
      <a href="/login/login.html" class="cf-btn cf-btn-outline">Login</a>
      <a href="/register/register.html" class="cf-btn cf-btn-outline" aria-current="page">Register</a>
    </nav>
  </header>

  <main class="page">

    <section class="cf-card cf-card-raised register-card">
      <h1>Register</h1>

      <div class="alert" id="formAlert" role="alert" hidden></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label class="cf-label" for="firstName">First name</label>
          <input class="cf-input" type="text" id="firstName" name="first_name" autocomplete="given-name" maxlength="49" required>
          <p class="cf-error" id="firstNameError" hidden></p>
        </div>

        <div class="field">
          <label class="cf-label" for="lastName">Last name</label>
          <input class="cf-input" type="text" id="lastName" name="last_name" autocomplete="family-name" maxlength="49" required>
          <p class="cf-error" id="lastNameError" hidden></p>
        </div>

        <div class="field">
          <label class="cf-label" for="email">Email</label>
          <input class="cf-input" type="email" id="email" name="email" autocomplete="email" inputmode="email" required>
          <p class="cf-error" id="emailError" hidden></p>
        </div>

        <div class="field">
          <label class="cf-label" for="contact">Contact number (optional)</label>
          <input class="cf-input" type="tel" id="contact" name="contact_number" autocomplete="tel" inputmode="tel" maxlength="20">
          <p class="cf-error" id="contactError" hidden></p>
        </div>

        <div class="field">
          <label class="cf-label" for="password">Password</label>

          <div class="password-wrap">
            <input class="cf-input" type="password" id="password" name="password" autocomplete="new-password" aria-describedby="passwordHint" required>
            <button type="button" class="show-hide" data-target="password" aria-controls="password">Show</button>
          </div>
          <p class="hint" id="passwordHint">At least 8 characters, with a letter and a number.</p>
          <p class="cf-error" id="passwordError" hidden></p>
        </div>

        <div class="field">
          <label class="cf-label" for="confirm">Confirm password</label>

          <div class="password-wrap">
            <input class="cf-input" type="password" id="confirm" name="confirm" autocomplete="new-password" required>
            <button type="button" class="show-hide" data-target="confirm" aria-controls="confirm">Show</button>
          </div>
          <p class="cf-error" id="confirmError" hidden></p>
        </div>

        <button type="submit" class="cf-btn cf-btn-primary cf-btn-block" id="registerButton">Register</button>
      </form>

      <p class="alt-link">Already have an account? <a href="/login/login.html">Login</a></p>
    </section>
  </main>

</body>
</html>
