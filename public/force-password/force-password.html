<!--force-password/force-password.html - page for setting a new password after an admin reset it-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change Temporary Password - ClinicFlow</title>

    <link rel="stylesheet" href="/force-password/force-password.css" />
    <script src="/force-password/force-password.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/force-password/force-password.html"
        ><span class="brand-mark"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" /></svg></span
        ><span>ClinicFlow</span></a
      >

      <div class="header-tools">
        <div class="theme-switch" role="group" aria-label="Color theme">
          <button
            type="button"
            data-theme-set="light"
            aria-label="Light mode"
            title="Light mode"
          >
            &#9728;
          </button>
          <button
            type="button"
            data-theme-set="dark"
            aria-label="Dark mode"
            title="Dark mode"
          >
            &#9790;
          </button>
        </div>
        <button type="button" class="logout-link" id="logoutButton">
          Logout
        </button>
      </div>
    </header>

    <main class="page">
      <p class="notice" role="note">You must change your temporary password</p>

      <section class="cf-card cf-card-raised form-card">
        <h1>Change your password</h1>

        <div class="alert alert-error" id="formAlert" role="alert" hidden></div>

        <form id="passwordForm" novalidate>
          <div class="field">
            <label class="cf-label" for="temporary">Temporary password</label>
            <div class="password-wrap">
              <input
                class="cf-input"
                type="password"
                id="temporary"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="show-hide"
                data-target="temporary"
                aria-controls="temporary"
              >
                Show
              </button>
            </div>
            <p class="cf-error" id="temporaryError" hidden></p>
          </div>

          <div class="field">
            <label class="cf-label" for="newPassword">New password</label>
            <div class="password-wrap">
              <input
                class="cf-input"
                type="password"
                id="newPassword"
                autocomplete="new-password"
                aria-describedby="passwordHint"
                required
              />
              <button
                type="button"
                class="show-hide"
                data-target="newPassword"
                aria-controls="newPassword"
              >
                Show
              </button>
            </div>
            <p class="hint" id="passwordHint">
              At least 8 characters, with a letter and a number. It must differ
              from your temporary password.
            </p>
            <p class="cf-error" id="newPasswordError" hidden></p>
          </div>

          <div class="field">
            <label class="cf-label" for="confirm">Confirm password</label>
            <div class="password-wrap">
              <input
                class="cf-input"
                type="password"
                id="confirm"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="show-hide"
                data-target="confirm"
                aria-controls="confirm"
              >
                Show
              </button>
            </div>
            <p class="cf-error" id="confirmError" hidden></p>
          </div>

          <button
            type="submit"
            class="cf-btn cf-btn-primary cf-btn-block"
            id="saveButton"
          >
            Save
          </button>
        </form>

        <div class="success-panel" id="successPanel" role="status" hidden>
          <p class="success-title">Password changed.</p>
          <p>You have been logged out. Log in again with your new password.</p>
          <a href="/login/login.html" class="cf-btn cf-btn-primary cf-btn-block"
            >Go to login</a
          >
        </div>
      </section>
    </main>
  </body>
</html>
