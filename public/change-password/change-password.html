<!--change-password/change-password.html - change password page for any logged in role-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password - ClinicFlow</title>

  <link rel="stylesheet" href="/change-password/change-password.css">
  <script src="/change-password/change-password.js"></script>
</head>
<body>
  <header class="site-header cf-panel cf-topbar">
    <a class="back-button" id="backButton" href="/" aria-label="Back to my page">&larr;</a>
    <a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span><span id="clinicName">ClinicFlow</span></a>

    <div class="header-tools">
      <div class="theme-switch" role="group" aria-label="Color theme">
        <button type="button" data-theme-set="light" aria-label="Light mode" title="Light mode">&#9728;</button>
        <button type="button" data-theme-set="dark" aria-label="Dark mode" title="Dark mode">&#9790;</button>
      </div>

      <div class="user-menu">
        <button type="button" class="user-button" id="userButton" aria-expanded="false" aria-controls="userMenu" aria-haspopup="true">
          <span class="avatar" id="headerInitials" aria-hidden="true"></span>
          <span class="user-name" id="headerName"></span>
        </button>
        <div class="user-dropdown" id="userMenu" hidden>
          <a href="/profile/profile.html">Edit Profile</a>
          <a href="/change-password/change-password.html" aria-current="page">Change Password</a>
          <button type="button" id="logoutButton">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main class="page">

    <section class="cf-card cf-card-raised form-card">
      <h1>Change Password</h1>

      <div class="alert alert-error" id="formAlert" role="alert" hidden></div>

      <form id="passwordForm" novalidate>
        <div class="field">
          <label class="cf-label" for="current">Current password</label>
          <div class="password-wrap">
            <input class="cf-input" type="password" id="current" autocomplete="current-password" required>
            <button type="button" class="show-hide" data-target="current" aria-controls="current">Show</button>
          </div>
          <p class="cf-error" id="currentError" hidden></p>
        </div>

        <div class="field">
          <label class="cf-label" for="newPassword">New password</label>
          <div class="password-wrap">
            <input class="cf-input" type="password" id="newPassword" autocomplete="new-password" aria-describedby="passwordHint" required>
            <button type="button" class="show-hide" data-target="newPassword" aria-controls="newPassword">Show</button>
          </div>
          <p class="hint" id="passwordHint">At least 8 characters, with a letter and a number. It must differ from your current password.</p>
          <p class="cf-error" id="newPasswordError" hidden></p>
        </div>

        <div class="field">
          <label class="cf-label" for="confirm">Confirm password</label>
          <div class="password-wrap">
            <input class="cf-input" type="password" id="confirm" autocomplete="new-password" required>
            <button type="button" class="show-hide" data-target="confirm" aria-controls="confirm">Show</button>
          </div>
          <p class="cf-error" id="confirmError" hidden></p>
        </div>

        <button type="submit" class="cf-btn cf-btn-primary cf-btn-block" id="saveButton">Save</button>
      </form>

      <div class="success-panel" id="successPanel" role="status" hidden>
        <p class="success-title">Password changed.</p>
        <p>You have been logged out. Log in again with your new password.</p>
        <a href="/login/login.html" class="cf-btn cf-btn-primary cf-btn-block">Go to login</a>
      </div>
    </section>
  </main>

</body>
</html>
