<!--error/error.html - error page for a missing page (404) or a page the role cannot open (403)-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - ClinicFlow</title>

  <link rel="stylesheet" href="/error/error.css">
  <script src="/error/error.js"></script>
</head>
<body>
  <header class="site-header cf-panel cf-topbar">
    <a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span><span>ClinicFlow</span></a>

    <div class="theme-switch" role="group" aria-label="Color theme">
      <button type="button" data-theme-set="light" aria-label="Light mode" title="Light mode">&#9728;</button>
      <button type="button" data-theme-set="dark" aria-label="Dark mode" title="Dark mode">&#9790;</button>
    </div>
  </header>

  <main class="page">
    <h1 id="errorTitle">404 Not Found</h1>
    <p class="message" id="errorMessage">We couldn't find the page you were looking for.</p>

    <div class="buttons">
      <a href="/" class="cf-btn cf-btn-primary">Back to home</a>
      <button type="button" class="cf-btn cf-btn-outline" id="retryButton" hidden>Try again</button>
    </div>
  </main>

</body>
</html>
